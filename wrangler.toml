name = "oneorigin-sovereign-cloud"
main = "src/worker.ts"
compatibility_date = "2026-10-27"
workers_dev = true

[vars]
PLATFORM_DOMAIN = "1origin.dev"
AI_GATEWAY_CACHE = "enabled"

[[r2_buckets]]
binding = "R2_CHECKPOINTS"
bucket_name = "oneorigin-agent-checkpoints"

[[r2_buckets]]
binding = "R2_RAG_EMBEDDINGS"
bucket_name = "sovereign-rag-embeddings"

[ai]
binding = "AI"
